<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="iotPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad3)"/>

  <!-- Technical Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
  </g>

  <!-- Frame -->
  <rect x="40" y="30" width="720" height="420" rx="12" fill="#0d1527" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title Bar -->
  <path d="M40 42 C40 35.37 45.37 30 52 30 L748 30 C754.63 30 760 35.37 760 42 L760 70 L40 70 Z" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="64" cy="50" r="5" fill="#ef4444"/>
  <circle cx="80" cy="50" r="5" fill="#f59e0b"/>
  <circle cx="96" cy="50" r="5" fill="#10b981"/>
  <text x="120" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">IOT SMART SWITCH &bull; HARDWARE-SOFTWARE INTEGRATION SCHEMATIC</text>
  <rect x="620" y="40" width="120" height="20" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="680" y="54" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">BUILT &amp; TESTED</text>

  <!-- 3 Stages Architecture Flow -->
  <!-- Stage 1: Client Mobile/Web UI -->
  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="190" height="280" rx="10" fill="#09101f" stroke="#00f2fe" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="35" rx="10" fill="#0e1726"/>
    <text x="95" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">CLIENT UI (WEB)</text>
    
    <!-- Phone / Screen Mockup elements -->
    <rect x="15" y="50" width="160" height="60" rx="6" fill="#111c33" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="72" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Appliance 01</text>
    <text x="25" y="88" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">● Status: ENERGIZED</text>
    <rect x="115" y="65" width="50" height="24" rx="12" fill="#10b981"/>
    <circle cx="150" cy="77" r="8" fill="#ffffff"/>

    <rect x="15" y="125" width="160" height="60" rx="6" fill="#111c33" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="147" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Appliance 02</text>
    <text x="25" y="163" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">○ Status: STANDBY</text>
    <rect x="115" y="140" width="50" height="24" rx="12" fill="#334155"/>
    <circle cx="127" cy="152" r="8" fill="#94a3b8"/>

    <rect x="15" y="200" width="160" height="65" rx="6" fill="#070b14"/>
    <text x="25" y="220" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Active Telemetry:</text>
    <text x="25" y="238" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Power: 65 Watts</text>
    <text x="25" y="252" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">WiFi RSSI: -54 dBm</text>
  </g>

  <!-- Arrow 1 (Data Stream) -->
  <g transform="translate(275, 230)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="45,-5 55,0 45,5" fill="#00f2fe"/>
    <text x="25" y="-12" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">MQTT / HTTP</text>
    <text x="25" y="22" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">JSON Payload</text>
  </g>

  <!-- Stage 2: Microcontroller & Logic -->
  <g transform="translate(345, 110)">
    <rect x="0" y="0" width="180" height="280" rx="10" fill="#09101f" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="35" rx="10" fill="#18182e"/>
    <text x="90" y="22" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">MICROCONTROLLER</text>

    <!-- Chip graphic -->
    <rect x="35" y="55" width="110" height="90" rx="6" fill="#111827" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="90" y="90" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">ESP32</text>
    <text x="90" y="110" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Wi-Fi + BLE SoC</text>
    <text x="90" y="125" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">C++ Firmware</text>

    <!-- Pin lines -->
    <rect x="25" y="165" width="130" height="85" rx="6" fill="#070b14"/>
    <text x="35" y="185" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">GPIO 18: HIGH (Relay 1)</text>
    <text x="35" y="202" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">GPIO 19: LOW (Relay 2)</text>
    <text x="35" y="220" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">ADC 34: 0.28 A Current</text>
    <text x="35" y="238" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">Loop Rate: 50 ms</text>
  </g>

  <!-- Arrow 2 (Signal Stream) -->
  <g transform="translate(540, 230)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="45,-5 55,0 45,5" fill="#818cf8"/>
    <text x="25" y="-12" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Optocoupled</text>
    <text x="25" y="22" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">3.3V Logic</text>
  </g>

  <!-- Stage 3: Relay & Physical Electrical Load -->
  <g transform="translate(600, 110)">
    <rect x="0" y="0" width="135" height="280" rx="10" fill="#09101f" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="135" height="35" rx="10" fill="#06281e"/>
    <text x="67" y="22" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">RELAY / LOAD</text>

    <!-- Relay 1 -->
    <rect x="15" y="55" width="105" height="75" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="67" y="80" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">RELAY 01</text>
    <text x="67" y="98" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">10A 250VAC</text>
    <text x="67" y="115" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">[ CLOSED ]</text>

    <!-- Relay 2 -->
    <rect x="15" y="150" width="105" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="67" y="175" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">RELAY 02</text>
    <text x="67" y="193" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">10A 250VAC</text>
    <text x="67" y="210" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">[ OPEN ]</text>

    <text x="67" y="255" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">AC Mains Isolated</text>
  </g>

  <!-- Bottom Console Status Bar -->
  <rect x="60" y="415" width="680" height="22" rx="4" fill="#070b14"/>
  <text x="75" y="430" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">● HARDWARE TELEMETRY PROTOCOL: MQTT SUBSCRIBER ON-DEVICE</text>
  <text x="725" y="430" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">EMBEDDED AUTOMATION ARCHITECTURE</text>
</svg>
