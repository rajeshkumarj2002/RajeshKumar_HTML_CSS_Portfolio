<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="topbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#p1Grad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- Browser Window Mockup Frame -->
  <rect x="50" y="40" width="500" height="280" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <!-- Window Titlebar -->
  <rect x="50" y="40" width="500" height="32" rx="10" fill="#1e293b"/>
  <circle cx="70" cy="56" r="5" fill="#ef4444"/>
  <circle cx="86" cy="56" r="5" fill="#eab308"/>
  <circle cx="102" cy="56" r="5" fill="#22c55e"/>
  <rect x="130" y="48" width="260" height="16" rx="4" fill="#0f172a"/>
  <text x="140" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">college-portal.edu/dashboard</text>

  <!-- Portal Header Banner -->
  <rect x="70" y="86" width="460" height="85" rx="8" fill="url(#topbarGrad)" opacity="0.95"/>
  <text x="90" y="118" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="800">COLLEGE MANAGEMENT SYSTEM</text>
  <text x="90" y="140" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11">Student &amp; Staff Attendance • Academic Performance &amp; Analytics</text>
  <rect x="425" y="105" width="85" height="28" rx="6" fill="#ffffff"/>
  <text x="467" y="123" fill="#4338ca" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Portal Login</text>

  <!-- 3 Dashboard Metric / Module Cards -->
  <rect x="70" y="185" width="140" height="115" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="80" y="196" width="40" height="18" rx="4" fill="#4f46e5"/>
  <text x="100" y="209" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Module</text>
  <text x="80" y="232" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Attendance</text>
  <text x="80" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Student &amp; Staff Log</text>
  <rect x="80" y="265" width="90" height="16" rx="3" fill="#0284c7" opacity="0.3"/>
  <text x="125" y="277" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">94.8% Average</text>

  <rect x="230" y="185" width="140" height="115" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="240" y="196" width="40" height="18" rx="4" fill="#059669"/>
  <text x="260" y="209" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Admin</text>
  <text x="240" y="232" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Hostel &amp; Transport</text>
  <text x="240" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Fee &amp; Route Tracking</text>
  <rect x="240" y="265" width="90" height="16" rx="3" fill="#059669" opacity="0.3"/>
  <text x="285" y="277" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Active Bus Routes</text>

  <rect x="390" y="185" width="140" height="115" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="400" y="196" width="40" height="18" rx="4" fill="#d97706"/>
  <text x="420" y="209" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Analytics</text>
  <text x="400" y="232" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Exam Insights</text>
  <text x="400" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Semester Reports</text>
  <rect x="400" y="265" width="90" height="16" rx="3" fill="#d97706" opacity="0.3"/>
  <text x="445" y="277" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Automated Grading</text>
</svg>
