<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p2Bg)"/>

  <!-- Browser Frame -->
  <rect x="50" y="40" width="500" height="280" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="50" y="40" width="500" height="32" rx="10" fill="#f1f5f9"/>
  <circle cx="70" cy="56" r="5" fill="#ef4444"/>
  <circle cx="86" cy="56" r="5" fill="#eab308"/>
  <circle cx="102" cy="56" r="5" fill="#22c55e"/>
  <rect x="130" y="48" width="240" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="60" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">shiftclock.app/roster-manager</text>

  <!-- Shift Clock Navbar inside preview -->
  <rect x="50" y="72" width="500" height="36" fill="#0f172a"/>
  <text x="75" y="95" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Shift Clock</text>
  <text x="160" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Automated Shift Alarm &amp; Schedule</text>
  <rect x="420" y="78" width="110" height="24" rx="4" fill="#4f46e5"/>
  <text x="475" y="94" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">3-Shift Roster Active</text>

  <!-- Left Main Shift Dial / Alarm Card -->
  <rect x="70" y="120" width="270" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="70" y="120" width="270" height="80" rx="8" fill="url(#shiftGrad)"/>
  
  <text x="90" y="148" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CURRENT SCHEDULE: SHIFT 1</text>
  <text x="90" y="174" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="800">06:00 AM &ndash; 02:00 PM</text>
  <text x="90" y="190" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Auto Alarm Set: 04:45 AM (Daily)</text>
  
  <text x="85" y="224" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Rotating Schedule Management</text>
  <text x="85" y="244" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Eliminates manual alarms for weekly rotating shifts</text>
  <text x="85" y="280" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="600">✓ On/Off Cycle Synced Automatically</text>

  <!-- Right Side Shift Stack -->
  <rect x="355" y="120" width="175" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="370" y="142" fill="#0284c7" font-family="system-ui, sans-serif" font-size="9" font-weight="700">SHIFT 2 (EVENING)</text>
  <text x="370" y="160" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">02:00 PM &ndash; 10:00 PM</text>
  <text x="370" y="186" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Alarm: 12:30 PM</text>

  <rect x="355" y="215" width="175" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="370" y="237" fill="#9333ea" font-family="system-ui, sans-serif" font-size="9" font-weight="700">SHIFT 3 (NIGHT)</text>
  <text x="370" y="255" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">10:00 PM &ndash; 06:00 AM</text>
  <text x="370" y="281" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Alarm: 08:30 PM</text>
</svg>
