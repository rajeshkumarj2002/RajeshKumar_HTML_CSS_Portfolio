<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="iotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p3Bg)"/>

  <!-- Browser Frame -->
  <rect x="50" y="40" width="500" height="280" rx="10" fill="#09090b" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="50" y="40" width="500" height="32" rx="10" fill="#18181b"/>
  <circle cx="70" cy="56" r="5" fill="#ef4444"/>
  <circle cx="86" cy="56" r="5" fill="#eab308"/>
  <circle cx="102" cy="56" r="5" fill="#22c55e"/>
  <rect x="130" y="48" width="220" height="16" rx="4" fill="#27272a"/>
  <text x="140" y="60" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">smartswitch.iot/control-hub</text>

  <!-- Showcase Hero Inside Browser -->
  <rect x="70" y="86" width="460" height="95" rx="8" fill="url(#iotGrad)"/>
  <text x="95" y="120" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="18" font-weight="800">IoT SMART SWITCH DASHBOARD</text>
  <text x="95" y="142" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Remote Appliance Switching • Visual Device Pairing &amp; Telemetry</text>
  <rect x="95" y="152" width="125" height="20" rx="4" fill="#ffffff" fill-opacity="0.2"/>
  <text x="157" y="166" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Status: 4 Nodes Online</text>

  <!-- Switch Items Grid below -->
  <rect x="70" y="195" width="140" height="105" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="82" y="218" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Appliance 1 (Lights)</text>
  <text x="82" y="235" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="9">Power: 45W Active</text>
  <rect x="82" y="258" width="60" height="24" rx="12" fill="#10b981"/>
  <circle cx="128" cy="270" r="9" fill="#ffffff"/>
  <text x="98" y="274" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">ON</text>

  <rect x="230" y="195" width="140" height="105" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="242" y="218" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Appliance 2 (AC Unit)</text>
  <text x="242" y="235" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="9">Standby: 0W</text>
  <rect x="242" y="258" width="60" height="24" rx="12" fill="#3f3f46"/>
  <circle cx="256" cy="270" r="9" fill="#ffffff"/>
  <text x="284" y="274" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="9" font-weight="700">OFF</text>

  <rect x="390" y="195" width="140" height="105" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="402" y="218" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Industrial Relay</text>
  <text x="402" y="235" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="9">Load: 240V / 12A</text>
  <rect x="402" y="258" width="60" height="24" rx="12" fill="#10b981"/>
  <circle cx="448" cy="270" r="9" fill="#ffffff"/>
  <text x="418" y="274" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">ON</text>
</svg>
