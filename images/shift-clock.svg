<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a30"/>
      <stop offset="100%" stop-color="#091222"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad2)"/>

  <!-- Technical Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
  </g>

  <!-- Frame -->
  <rect x="40" y="30" width="720" height="420" rx="12" fill="#0d1527" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Title Bar -->
  <path d="M40 42 C40 35.37 45.37 30 52 30 L748 30 C754.63 30 760 35.37 760 42 L760 70 L40 70 Z" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="64" cy="50" r="5" fill="#ef4444"/>
  <circle cx="80" cy="50" r="5" fill="#f59e0b"/>
  <circle cx="96" cy="50" r="5" fill="#10b981"/>
  <text x="120" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">SHIFT CLOCK &bull; ROTATIONAL SHIFT SCHEDULER &amp; ALARM WEB APP</text>
  <rect x="620" y="40" width="120" height="20" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="680" y="54" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">LIVE APPLICATION</text>

  <!-- Left: 24h Rotational Dial -->
  <g transform="translate(220, 255)">
    <!-- Dial Base -->
    <circle cx="0" cy="0" r="140" fill="url(#dialGrad)" stroke="#1e293b" stroke-width="2"/>
    <!-- Outer Arc for 3 shifts -->
    <!-- Shift 1: 06:00 to 14:00 (90 deg to 210 deg) -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#0ea5e9" stroke-width="16" stroke-dasharray="240 720" stroke-dashoffset="-60"/>
    <!-- Shift 2: 14:00 to 22:00 -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#6366f1" stroke-width="16" stroke-dasharray="240 720" stroke-dashoffset="-300"/>
    <!-- Shift 3: 22:00 to 06:00 -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#f59e0b" stroke-width="16" stroke-dasharray="240 720" stroke-dashoffset="-540"/>

    <!-- Inner Dial Core -->
    <circle cx="0" cy="0" r="85" fill="#070b14" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="-20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">ACTIVE ROSTER</text>
    <text x="0" y="8" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" text-anchor="middle">SHIFT 01</text>
    <text x="0" y="28" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">06:00 &ndash; 14:00</text>
    <text x="0" y="48" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">● ALARM ARMED 04:30 AM</text>
  </g>

  <!-- Right: 3 Shift Information Cards -->
  <g transform="translate(420, 100)">
    <!-- Card 1: Morning Shift -->
    <rect x="0" y="0" width="310" height="90" rx="8" fill="#09101f" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="12" y="12" width="70" height="20" rx="4" fill="#0ea5e9" fill-opacity="0.2"/>
    <text x="47" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">SHIFT 01</text>
    <text x="95" y="27" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Morning Shift (06:00 &ndash; 14:00)</text>
    <text x="14" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Wake-up Alarm: 04:30 AM (90m Buffer)</text>
    <text x="14" y="70" fill="#64748b" font-family="sans-serif" font-size="10">Target Sleep Window: 21:30 PM &ndash; 04:30 AM (7h Rest)</text>

    <!-- Card 2: Afternoon Shift -->
    <rect x="0" y="105" width="310" height="90" rx="8" fill="#09101f" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="117" width="70" height="20" rx="4" fill="#6366f1" fill-opacity="0.2"/>
    <text x="47" y="131" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">SHIFT 02</text>
    <text x="95" y="132" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">General Shift (14:00 &ndash; 22:00)</text>
    <text x="14" y="157" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Wake-up Alarm: 12:15 PM (105m Buffer)</text>
    <text x="14" y="175" fill="#64748b" font-family="sans-serif" font-size="10">Target Sleep Window: 23:45 PM &ndash; 07:45 AM (8h Rest)</text>

    <!-- Card 3: Night Shift -->
    <rect x="0" y="210" width="310" height="90" rx="8" fill="#09101f" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="222" width="70" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="47" y="236" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">SHIFT 03</text>
    <text x="95" y="237" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Night Shift (22:00 &ndash; 06:00)</text>
    <text x="14" y="262" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Wake-up Alarm: 20:15 PM (105m Buffer)</text>
    <text x="14" y="280" fill="#64748b" font-family="sans-serif" font-size="10">Target Sleep Window: 07:30 AM &ndash; 15:30 PM (Day Rest)</text>
  </g>

  <!-- Bottom Console Status Bar -->
  <rect x="60" y="415" width="680" height="22" rx="4" fill="#070b14"/>
  <text x="75" y="430" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">● SYSTEM STATUS: ACTIVE &bull; ROTATIONAL ALGORITHM OPERATIONAL</text>
  <text x="725" y="430" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">ERGONOMIC ROTATION ALGORITHM</text>
</svg>
