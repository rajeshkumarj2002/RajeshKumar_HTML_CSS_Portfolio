  <circle cx="64" cy="50" r="5" fill="#ef4444"/>
  <circle cx="80" cy="50" r="5" fill="#f59e0b"/>
  <circle cx="96" cy="50" r="5" fill="#10b981"/>
  
  <text x="120" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">COLLEGE MANAGEMENT SYSTEM &bull; MODULAR WEB ARCHITECTURE</text>
  <rect x="620" y="40" width="120" height="20" rx="4" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1"/>
  <text x="680" y="54" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">FEATURED PROJECT</text>

  <!-- Central Hub Node -->
