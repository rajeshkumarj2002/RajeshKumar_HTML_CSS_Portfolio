  <text x="400" y="250" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Python / Django / SQL</text>
  <text x="400" y="270" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Unified Database &amp; Auth</text>

