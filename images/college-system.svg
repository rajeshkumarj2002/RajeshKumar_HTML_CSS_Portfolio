  <rect x="60" y="415" width="680" height="22" rx="4" fill="#070b14"/>
  <text x="75" y="430" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">● SYSTEM STATUS: PRODUCTION READY &bull; MODULES FUNCTIONAL</text>
  <text x="725" y="430" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">CSE CAPSTONE PROJECT &bull; SRI VENKATESWARA IST</text>
