  <path d="M190 135 L300 220" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5 4" opacity="0.7"/>
  <path d="M190 355 L300 260" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5 4" opacity="0.7"/>
  <path d="M610 135 L500 220" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5 4" opacity="0.7"/>
  <path d="M610 355 L500 260" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5 4" opacity="0.7"/>
  <path d="M400 130 L400 195" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 3" opacity="0.8"/>

