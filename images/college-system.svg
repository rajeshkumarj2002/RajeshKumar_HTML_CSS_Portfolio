  <text x="590" y="125" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">MODULE 03</text>
  <text x="590" y="145" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Campus Transport</text>
  <text x="590" y="162" fill="#94a3b8" font-family="sans-serif" font-size="10">Bus Fleet &amp; Route Stops</text>

