  <rect x="570" y="315" width="160" height="80" rx="8" fill="#09101f" stroke="#334155" stroke-width="1.5"/>
  <text x="590" y="345" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">MODULE 04</text>
  <text x="590" y="365" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Hostel Allocation</text>
  <text x="590" y="382" fill="#94a3b8" font-family="sans-serif" font-size="10">Room &amp; Mess Accounts</text>

