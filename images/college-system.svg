  <text x="90" y="365" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Payroll Engine</text>
  <text x="90" y="382" fill="#94a3b8" font-family="sans-serif" font-size="10">Salary &amp; Deduction Logs</text>

