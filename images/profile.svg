<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle with glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>
  
  <!-- Subtle geometric accent rings -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="200" cy="200" r="145" fill="#312e81" opacity="0.35"/>

  <!-- Character Group with Shadow -->
  <g filter="url(#softShadow)">
    <!-- Shoulders & Body / Professional Collar Shirt -->
    <path d="M110 360 C110 288 140 268 200 268 C260 268 290 288 290 360 Z" fill="url(#shirtGrad)"/>
    <!-- Inner collar V -->
    <path d="M172 268 L200 312 L228 268 Z" fill="#334155"/>
    <path d="M175 268 L200 296 L225 268" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="182" y="222" width="36" height="52" rx="8" fill="#eab308" opacity="0.9"/>

    <!-- Head -->
    <ellipse cx="200" cy="186" rx="58" ry="68" fill="#f59e0b" opacity="0.95"/>

    <!-- Hair -->
    <path d="M142 175 C142 118 162 108 200 108 C238 108 258 118 258 175 C258 138 238 122 200 122 C162 122 146 140 142 175 Z" fill="#0f172a"/>
    <path d="M144 162 C148 132 172 116 200 116 C232 116 254 132 256 162 C248 136 228 128 200 128 C166 128 152 138 144 162 Z" fill="#020617"/>

    <!-- Eyebrows -->
    <path d="M166 168 Q180 164 190 168" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M210 168 Q220 164 234 168" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Stylish Modern Glasses Frame -->
    <rect x="156" y="174" width="36" height="26" rx="6" fill="#0f172a" fill-opacity="0.1" stroke="#0f172a" stroke-width="3.5"/>
    <rect x="208" y="174" width="36" height="26" rx="6" fill="#0f172a" fill-opacity="0.1" stroke="#0f172a" stroke-width="3.5"/>
    <line x1="192" y1="184" x2="208" y2="184" stroke="#0f172a" stroke-width="3.5"/>
    <!-- Glasses Temples -->
    <line x1="156" y1="182" x2="142" y2="178" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="244" y1="182" x2="258" y2="178" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyes (behind glasses) -->
    <circle cx="174" cy="187" r="4.5" fill="#0f172a"/>
    <circle cx="226" cy="187" r="4.5" fill="#0f172a"/>
    <circle cx="176" cy="185" r="1.5" fill="#ffffff"/>
    <circle cx="228" cy="185" r="1.5" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M198 194 Q202 204 200 209" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Confident Smile -->
    <path d="M185 224 Q200 238 215 224" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Tech Floating Badges -->
  <g transform="translate(42, 110)">
    <rect width="68" height="28" rx="14" fill="#0f172a" opacity="0.9"/>
    <text x="34" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">&lt;CSE/&gt;</text>
  </g>
  <g transform="translate(290, 110)">
    <rect width="68" height="28" rx="14" fill="#0f172a" opacity="0.9"/>
    <text x="34" y="18" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">{HTML/CSS}</text>
  </g>
  <g transform="translate(130, 335)">
    <rect width="140" height="30" rx="15" fill="#10b981" filter="url(#softShadow)"/>
    <circle cx="146" cy="350" r="5" fill="#ecfdf5"/>
    <text x="206" y="354" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RAJESH KUMAR J</text>
  </g>
</svg>
